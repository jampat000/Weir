# Grouped updates match Dependabot PR titles like "bump the server group" / "bump the actions group".
version: 2
updates:
  # The .NET server. Versions are pinned centrally in apps/server/Directory.Packages.props.
  - package-ecosystem: nuget
    directory: /apps/server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      server:
        patterns:
          - "*"

  # The Python test runners (contract suite, E2E, packaged live audit): tests/requirements.txt.
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      test-runners:
        patterns:
          - "*"
    # pyee 14.0.0 requires Python >=3.12 and the workflows run 3.11, so the whole
    # test-runners group fails to install and every update in it is held hostage.
    # Lift this together with the Python version in ci.yml and release.yml.
    ignore:
      - dependency-name: "pyee"
        versions:
          - ">=14.0.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  # apps/web is the shipped frontend. CI's `npm audit --audit-level=high` only fails a build
  # after the fact and ignores moderate severities; this is what opens the PRs that fix them.
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Keep unsupported toolchain majors quiet until their peer ecosystem catches up.
    # Checked 2026-09-27: eslint-plugin-jsx-a11y 6.10.2 (latest) still declares
    # peerDependencies eslint "^3 || ... || ^9" and rejects ESLint 10.11.0 (latest);
    # see jsx-eslint/eslint-plugin-jsx-a11y#1075. openapi-typescript 7.13.0 (latest)
    # still declares peerDependencies typescript "^5.x" and has no TypeScript 6/7
    # support yet; see openapi-ts/openapi-typescript#2723 (TS6) and #2841 (TS7).
    # Dependabot will resume these automatically when the bounds below are
    # deliberately revised with the corresponding migration.
    ignore:
      - dependency-name: "eslint"
        versions:
          - ">=10.0.0"
      - dependency-name: "@eslint/js"
        versions:
          - ">=10.0.0"
      - dependency-name: "typescript"
        versions:
          - ">=6.0.0"

  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docs-site:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Checked 2026-09-27: @docusaurus/tsconfig (from Docusaurus 3.10.2, latest;
    # no newer major is out) still sets "baseUrl": "." in its published tsconfig,
    # which TypeScript 7.0.2 rejects outright (error TS5102, "Option 'baseUrl'
    # has been removed"); see facebook/docusaurus#11893. Lift this once Docusaurus
    # drops baseUrl from that config.
    ignore:
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0"

  # The tray, which ships in the Windows installer. Its pins are in apps/tray/Directory.Packages.props.
  - package-ecosystem: nuget
    directory: /apps/tray
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tray:
        patterns:
          - "*"

  # The Dockerfile's base images, pinned by digest with the tag kept as a comment for context.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns:
          - "*"
