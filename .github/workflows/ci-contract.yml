# The contract suite (#516), called by ci.yml: apps/server/tests/Weir.Contract.Tests starts the built .NET server as
# a separate process and talks to it only over HTTP (its README.md). One leg per area in that project's areas.json,
# all at once, rather than one long runner.
name: Contract suite

on:
  workflow_call:
    inputs:
      areas:
        description: JSON list of contract area names, one leg each.
        type: string
        required: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  area:
    name: contract (${{ matrix.area }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(inputs.areas) }}
    env:
      WEIR_SESSION_SECRET: ${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-ci-session-secret-32chars-min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The real-ffmpeg scenarios (Processing) run when ffmpeg and ffprobe are on PATH, and skip without them, so
      # a runner that lacks them is fixed here rather than left to pass quietly.
      - name: Install ffmpeg
        run: |
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: apps/server/global.json
          cache: true
          cache-dependency-path: apps/server/**/packages.lock.json

      # The contract project builds the server (Weir.Host) and the fake ffprobe/ffmpeg before itself and starts them
      # as processes; it references no server code.
      - name: Build the contract suite and the server under test
        working-directory: apps/server
        run: |
          dotnet restore tests/Weir.Contract.Tests --locked-mode
          dotnet build tests/Weir.Contract.Tests --no-restore

      # `dotnet test` passes when a filter matches nothing, so scripts/check-contract-areas.mjs (repo-checks)
      # guarantees every area in areas.json has test classes.
      - name: Contract suite, area (${{ matrix.area }})
        id: contract
        working-directory: apps/server
        env:
          CONTRACT_AREA: ${{ matrix.area }}
          # Keep each server's data folder and log (<folder>/contract-logs) until the leg is known to have passed.
          WEIR_CONTRACT_KEEP_DATA: "1"
          # Every server the suite starts gets its data folder under here, so a failed leg can upload them.
          TMPDIR: ${{ runner.temp }}/weir-contract-data
        run: |
          mkdir -p "$TMPDIR"
          dotnet test tests/Weir.Contract.Tests --no-build --filter "Area=$CONTRACT_AREA"

      - name: Upload contract data folders and server logs
        if: ${{ !cancelled() && steps.contract.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weir-contract-data-${{ matrix.area }}
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/weir-contract-data
