# The SQLite pool-race stress test (Issue640PoolRaceStressTests, Category=Stress), excluded from ci.yml's
# normal run because it deliberately runs several seconds of wall clock across 8 threads and would starve
# every other test running alongside it. Runs nightly and on demand instead.
name: Stress

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  sqlite-pool-race:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: apps/server/global.json
          cache: true
          cache-dependency-path: apps/server/**/packages.lock.json

      - name: Restore Weir server (locked)
        working-directory: apps/server
        run: dotnet restore Weir.slnx --locked-mode

      - name: Run the pool-race stress test
        working-directory: apps/server
        run: dotnet test Weir.slnx --filter "Category=Stress"
