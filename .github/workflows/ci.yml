# Weir CI: the server on Linux and Windows, the web app, the E2E smoke, the contract suite (ci-contract.yml), the
# tray, and the Docker and Windows package smokes (ci-packaging.yml). Triggers: push to main, pull_request,
# workflow_dispatch.
#
# `changes` turns the paths a change touches into one run_* flag per job, and each job runs only when its flag
# is true; a manual run runs everything. `ci-passed` needs every job and passes only when each job that was due
# passed and each job that was not due was skipped (scripts/ci-passed.mjs). It is the one check main's ruleset
# requires, and the one the release asks for on the tagged commit (scripts/verify-ci-for-release.mjs).
# scripts/check-release-workflow-gates.mjs checks that ci-passed needs every job here.
#
# A push to main always runs server-windows and tray, whatever changed, so every commit a release can tag has
# had its server tested on Windows and its tray tested in that exact tree.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_server_linux: ${{ steps.flags.outputs.run_server_linux }}
      run_server_windows: ${{ steps.flags.outputs.run_server_windows }}
      run_server_audit: ${{ steps.flags.outputs.run_server_audit }}
      run_web: ${{ steps.flags.outputs.run_web }}
      run_web_audit: ${{ steps.flags.outputs.run_web_audit }}
      run_e2e: ${{ steps.flags.outputs.run_e2e }}
      run_contract: ${{ steps.flags.outputs.run_contract }}
      run_tray: ${{ steps.flags.outputs.run_tray }}
      run_packaging: ${{ steps.flags.outputs.run_packaging }}
      run_arm64: ${{ steps.flags.outputs.run_arm64 }}
      contract_areas: ${{ steps.areas.outputs.areas }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # One contract leg per area in areas.json, so a new area gets its leg without editing this file.
      - name: Contract areas
        id: areas
        run: |
          areas="$(jq -c '[.areas[].name]' tests/contract/areas.json)"
          echo "Contract areas: $areas"
          echo "areas=$areas" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            server:
              - 'apps/server/**'
            web:
              - 'apps/web/**'
            harness:
              - 'tests/**'
              - 'scripts/**'
              - 'pytest.ini'
            contract:
              - 'tests/contract/**'
              - 'tests/e2e/weir/_runtime.py'
              - 'tests/requirements.txt'
              - 'apps/server/**'
            tray:
              - 'apps/tray/**'
              # The tray imports the server's build rules and product version.
              - 'apps/server/Directory.Build.props'
            packaging:
              - 'packaging/**'
              - 'docker/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'compose.yaml'
              - 'apps/tray/**'
              - 'apps/server/**'
              - 'apps/web/**'
              - 'scripts/smoke-windows-package.ps1'
              - 'scripts/live-packaged-e2e.py'
              - 'scripts/wait-for-health.mjs'
              - 'scripts/ffmpeg-cache-key.mjs'
            docker:
              - 'docker/**'
              - 'Dockerfile'
              - '.dockerignore'
            workflows:
              - '.github/**'

      # Web checks also run for server and harness changes: the server embeds the OpenAPI document the web
      # app's generated types come from, and the E2E smoke and contract suite serve the built web app. The
      # audits and the E2E smoke run on pull requests; a push to main was a squash merge its pull request
      # already ran them on. The arm64 image builds under QEMU, which is slow, so only when the image changes.
      - name: Which jobs are due
        id: flags
        env:
          EVENT: ${{ github.event_name }}
          SERVER: ${{ steps.filter.outputs.server }}
          WEB: ${{ steps.filter.outputs.web }}
          HARNESS: ${{ steps.filter.outputs.harness }}
          CONTRACT: ${{ steps.filter.outputs.contract }}
          TRAY: ${{ steps.filter.outputs.tray }}
          PACKAGING: ${{ steps.filter.outputs.packaging }}
          DOCKER: ${{ steps.filter.outputs.docker }}
          WORKFLOWS: ${{ steps.filter.outputs.workflows }}
        run: |
          set -euo pipefail
          either() { for value in "$@"; do if [ "$value" = true ]; then echo true; return; fi; done; echo false; }
          manual=$([ "$EVENT" = workflow_dispatch ] && echo true || echo false)
          main_push=$([ "$EVENT" = push ] && echo true || echo false)
          all=$(either "$manual" "$WORKFLOWS")
          on_pull_request() { if [ "$main_push" = true ]; then echo false; else echo "$1"; fi; }

          web=$(either "$all" "$SERVER" "$HARNESS" "$WEB")
          {
            echo "run_server_linux=$(either "$all" "$SERVER")"
            echo "run_server_windows=$(either "$all" "$SERVER" "$main_push")"
            echo "run_server_audit=$(on_pull_request "$(either "$all" "$SERVER")")"
            echo "run_web=$web"
            echo "run_web_audit=$(on_pull_request "$(either "$all" "$WEB")")"
            echo "run_e2e=$(on_pull_request "$web")"
            echo "run_contract=$(either "$all" "$CONTRACT")"
            echo "run_tray=$(either "$all" "$TRAY" "$main_push")"
            echo "run_packaging=$(either "$all" "$PACKAGING")"
            echo "run_arm64=$(either "$manual" "$DOCKER")"
          } | tee -a "$GITHUB_OUTPUT"

  # Cheap checks on the repository itself, on every change.
  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Weir agent documentation map
        run: node scripts/check-agent-docs.mjs

      - name: GitHub Actions pin check
        run: node scripts/check-github-action-pins.mjs

      - name: Release and CI gate rules
        run: |
          node scripts/check-release-workflow-gates.mjs
          node --test scripts/verify-ci-for-release.test.mjs scripts/ci-passed.test.mjs

  server-linux:
    needs: changes
    if: needs.changes.outputs.run_server_linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: apps/server/global.json
          cache: true
          cache-dependency-path: apps/server/**/packages.lock.json

      - name: Restore Weir server (locked)
        run: dotnet restore apps/server/Weir.slnx --locked-mode

      # Warnings are errors, and so are the unused-member analyzers (IDE0051/IDE0052, apps/server/.editorconfig):
      # that is the server's dead-code guard.
      - name: Build Weir server (warnings are errors)
        run: dotnet build apps/server/Weir.slnx -warnaserror --no-restore

      - name: Test Weir server
        run: dotnet test apps/server/Weir.slnx --no-build

      - name: Server dependency vulnerability scan
        if: needs.changes.outputs.run_server_audit == 'true'
        run: node scripts/check-dotnet-vulnerabilities.mjs apps/server/Weir.slnx

  # The server's Windows-only code paths (file identity, same-folder renames, sharing violations) only run here.
  server-windows:
    needs: changes
    if: needs.changes.outputs.run_server_windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: apps/server/global.json
          cache: true
          cache-dependency-path: apps/server/**/packages.lock.json

      - name: Restore Weir server (locked)
        run: dotnet restore apps/server/Weir.slnx --locked-mode

      - name: Build Weir server (warnings are errors)
        run: dotnet build apps/server/Weir.slnx -warnaserror --no-restore

      - name: Test Weir server
        run: dotnet test apps/server/Weir.slnx --no-build

  # The production web build, once, for the E2E smoke and every contract leg to serve.
  web-dist:
    needs: changes
    if: needs.changes.outputs.run_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Weir web - install and build (tokens, types, bundle budget)
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - name: Upload web dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weir-web-dist
          if-no-files-found: error
          retention-days: 1
          path: apps/web/dist

  web:
    needs: changes
    if: needs.changes.outputs.run_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # The build itself is web-dist's.
      - name: Weir web - install, API types, lint, format, unit tests
        working-directory: apps/web
        run: |
          npm ci
          npm run api:types:check
          npm run lint
          npm run format
          npm run test

      # After the web install above, so it reuses apps/web/node_modules for ts-prune.
      - name: Weir dead-code guard
        run: node scripts/check-dead-code.mjs

      - name: Frontend dependency vulnerability scan
        if: needs.changes.outputs.run_web_audit == 'true'
        working-directory: apps/web
        run: npm audit --audit-level=high

  e2e-smoke:
    needs: [changes, web-dist]
    if: needs.changes.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEIR_SESSION_SECRET: ${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-ci-session-secret-32chars-min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: apps/server/global.json
          cache: true
          cache-dependency-path: apps/server/**/packages.lock.json

      # The smoke runs `dotnet run --no-build` on the host (tests/e2e/weir/conftest.py).
      - name: Build Weir server (the server under test)
        run: |
          dotnet restore apps/server/src/Weir.Host --locked-mode
          dotnet build apps/server/src/Weir.Host --no-restore

      - name: Download web dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weir-web-dist
          path: apps/web/dist

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/requirements.txt') }}

      - name: Install locked test runner + Playwright browser
        run: |
          python -m pip install --require-hashes -r tests/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Weir E2E smoke (Playwright + real .NET server)
        env:
          WEIR_E2E: "1"
          WEIR_HOME: ${{ runner.temp }}/weir-e2e
        run: python -m pytest tests/e2e/weir -q --tb=short

  # The contract suite, one leg per area (ci-contract.yml).
  contract:
    needs: [changes, web-dist]
    if: needs.changes.outputs.run_contract == 'true'
    uses: ./.github/workflows/ci-contract.yml
    with:
      areas: ${{ needs.changes.outputs.contract_areas }}

  # The tray's unit tests: port choice, update settings and menu state, the health wait, the session secret's
  # access list, and which processes the installer may stop.
  tray:
    needs: changes
    if: needs.changes.outputs.run_tray == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: apps/server/global.json
          cache: true
          cache-dependency-path: apps/tray/**/packages.lock.json

      - name: Restore Weir tray (locked)
        run: dotnet restore apps/tray/Weir.Tray.slnx --locked-mode

      # Warnings are errors through apps/tray/Directory.Build.props.
      - name: Build Weir tray
        run: dotnet build apps/tray/Weir.Tray.slnx --no-restore

      - name: Test Weir tray
        run: dotnet test apps/tray/Weir.Tray.slnx --no-build

  # The Docker and Windows package smokes (ci-packaging.yml).
  packaging:
    needs: changes
    if: needs.changes.outputs.run_packaging == 'true'
    uses: ./.github/workflows/ci-packaging.yml
    with:
      arm64: ${{ needs.changes.outputs.run_arm64 == 'true' }}

  # The verdict. `always()` so it reports even when a job it needs failed or was skipped.
  ci-passed:
    needs: [changes, repo-checks, server-linux, server-windows, web-dist, web, e2e-smoke, contract, tray, packaging]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Every job that was due passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-passed.mjs
