# Mutation testing of the code that can lose a person's film or lock them out (#977, docs/coverage/mutation.md).
# Line coverage says a line ran; a mutation run changes the code (flips a condition, drops a statement, swaps an
# operator) and checks that some test fails. A change no test notices is a survivor, and each survivor is a test that
# is missing.
#
# One matrix job per target, each running Stryker.NET (the server and the tray) or StrykerJS (the web app) over only the
# files the target names, then one job that holds every target's score to its floor in docs/coverage/mutation-floors.json
# and lists the survivors on its summary page. It runs weekly and on demand, never on a pull request: a target takes
# tens of minutes.
name: Mutation

on:
  schedule:
    - cron: "41 2 * * 0"
  workflow_dispatch:
  # TEMPORARY (#977): the first measuring runs, before this file is on main. Removed before the merge.
  push:
    branches: ["coverage/977-mutation-testing"]
    paths: [".github/workflows/mutation.yml"]

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

# TEMPORARY (#977): the matrix is cut to the targets still being measured (second sample); restored before the merge.
jobs:
  mutate:
    name: Mutate ${{ matrix.target }}
    runs-on: windows-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: file-lifecycle-swap-preflight, kind: dotnet, directory: apps/server/tests/Weir.Infrastructure.Tests, config: ../../mutation/file-lifecycle-swap-preflight/stryker-config.json, restore: apps/server, solution: Weir.slnx }
          - { target: file-lifecycle-swap-prepare, kind: dotnet, directory: apps/server/tests/Weir.Infrastructure.Tests, config: ../../mutation/file-lifecycle-swap-prepare/stryker-config.json, restore: apps/server, solution: Weir.slnx }
          - { target: file-lifecycle-swap-commit, kind: dotnet, directory: apps/server/tests/Weir.Infrastructure.Tests, config: ../../mutation/file-lifecycle-swap-commit/stryker-config.json, restore: apps/server, solution: Weir.slnx }
          - { target: web-api-client, kind: web }
          - { target: web-processing-files, kind: web }
          - { target: web-processing-libraries, kind: web }
          - { target: web-settings-requests, kind: web }
          - { target: web-dialogs-library, kind: web }
          - { target: web-dialogs-activity-profile, kind: web }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: matrix.kind == 'dotnet'
        with:
          global-json-file: apps/server/global.json
          cache: true
          cache-dependency-path: apps/*/**/packages.lock.json

      # Restored from the solution's own folder, so its global.json picks the pinned SDK the lock files were made with.
      - name: Restore (locked) and the pinned Stryker.NET
        if: matrix.kind == 'dotnet'
        working-directory: ${{ matrix.restore }}
        shell: bash
        run: |
          dotnet restore "${{ matrix.solution }}" --locked-mode
          dotnet tool restore

      # The real-tool tests skip themselves here: a mutation run needs the tests that judge the code, and the ones that
      # need ffmpeg or mkvmerge judge the media layer, not these targets. Stryker runs the test project in its own folder
      # (each config path is from that folder), 4 mutants at a time.
      - name: Mutate with Stryker.NET
        if: matrix.kind == 'dotnet'
        timeout-minutes: 180
        working-directory: ${{ matrix.directory }}
        shell: bash
        run: dotnet stryker -f "${{ matrix.config }}" -O "$GITHUB_WORKSPACE/mutation-output" --skip-version-check

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: matrix.kind == 'web'
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install the web app
        if: matrix.kind == 'web'
        timeout-minutes: 10
        working-directory: apps/web
        run: npm ci

      - name: Mutate with StrykerJS
        if: matrix.kind == 'web'
        timeout-minutes: 180
        working-directory: apps/web
        shell: bash
        run: |
          npx stryker run mutation/${{ matrix.target }}/stryker.config.json

      - name: Gather the report
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p mutation-report
          if [ "${{ matrix.kind }}" = dotnet ]; then
            cp mutation-output/reports/mutation-report.json mutation-output/reports/mutation-report.html mutation-report/ || true
          else
            cp apps/web/reports/mutation/${{ matrix.target }}/mutation-report.json apps/web/reports/mutation/${{ matrix.target }}/mutation-report.html mutation-report/ || true
          fi

      - name: Upload the mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30
          path: mutation-report

  # Every target's score against its floor; the survivors on the summary page and in an artifact.
  check:
    needs: mutate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Download every target's report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mutation-*
          path: mutation-reports

      - name: Mutation scores against the floors
        run: node scripts/check-mutation-floors.mjs --floors docs/coverage/mutation-floors.json --reports mutation-reports --out mutation-survivors

      - name: Upload the survivors
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-survivors
          if-no-files-found: ignore
          retention-days: 90
          path: mutation-survivors
