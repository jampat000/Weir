# Tag-driven release: push tag v* (not a prerelease v*-*) -> CI proof, Windows installer, Docker image, GitHub Release.
#
# Every job but publish starts at once and none of them can publish anything:
#
#   ci-passed         ci.yml's ci-passed job already passed on this exact commit
#                     (scripts/verify-ci-for-release.mjs), so the release does not repeat CI's tests.
#   validate          release-only checks: notes file, gate ordering, dependency advisories as of
#                     today, the E2E smoke, and the production web build that ships as an asset.
#   windows-smoke     builds, smokes and uploads the Windows package (artifact, not public).
#   docker-candidate  builds the linux/amd64 image unpushed and runs the full live E2E against it.
#   docker-arm64      builds the linux/arm64 image unpushed (QEMU).
#
# publish needs all five. It alone holds registry credentials, `packages: write` and
# `contents: write`, so nothing reaches ghcr or the Releases page unless every check above passed.
# It pushes only the version tag, smokes that image, publishes the GitHub Release, and only then
# moves `latest`, so `latest` never points at an image that failed its smoke.
# scripts/check-release-workflow-gates.mjs enforces that shape.
name: Release

on:
  push:
    tags:
      - "v*"
      - "!v*-*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # The tag that triggered this run, named explicitly here rather than read from the runner's
  # ambient GITHUB_REF_NAME in each step: every step below that needs the tag gets it the same
  # declared way as every other value this workflow passes around.
  TAG: ${{ github.ref_name }}

jobs:
  # Waits (up to 45 minutes) while a CI run for this commit is queued or running, because the normal
  # flow is to tag straight after merging and main's CI is then still going; refusing there would make
  # every release a manual re-run. It never waits for a run that does not exist beyond a short grace
  # period, and it fails with the fix (a manual ci.yml run on the tag) when no run can prove the commit.
  ci-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ci.yml passed on the tagged commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-ci-for-release.mjs --wait-minutes 45

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # For actions/attest-build-provenance below: it signs over OIDC (id-token) and records the
      # attestation against this repo (attestations), neither of which is registry or Release
      # access, so it does not need the publish job's packages/contents write.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Normalize tag version
        id: version
        shell: bash
        run: echo "plain=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Validate release version alignment
        shell: bash
        run: node scripts/check-release-version.mjs "$TAG"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: apps/server/global.json
          cache: true
          cache-dependency-path: |
            apps/server/**/packages.lock.json
            apps/tray/**/packages.lock.json

      # Same caches as ci-packaging.yml: both FFmpeg and MKVToolNix are pinned in build-velopack.ps1,
      # so both keys come from that file's own pin. The build script re-checks the vendored copy either way.
      - name: FFmpeg build checksum
        id: ffmpeg
        shell: bash
        run: node scripts/ffmpeg-cache-key.mjs >> "$GITHUB_OUTPUT"

      - name: Cache vendored FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packaging/windows/vendor/ffmpeg
          key: ${{ runner.os }}-${{ steps.ffmpeg.outputs.key }}

      - name: Cache vendored MKVToolNix
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packaging/windows/vendor/mkvtoolnix
          key: mkvtoolnix-vendor-${{ runner.os }}-${{ hashFiles('packaging/windows/build-velopack.ps1') }}
          restore-keys: |
            mkvtoolnix-vendor-${{ runner.os }}-

      # Builds the web app, publishes the .NET server (win-x64 single file) and the tray, vendors FFmpeg and
      # MKVToolNix, installs the pinned vpk CLI and packs.
      - name: Build Weir Windows package (Velopack)
        env:
          WEIR_BUILD_VERSION: ${{ steps.version.outputs.plain }}
          VITE_SUPPORT_URL: ${{ vars.VITE_SUPPORT_URL }}
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/build-velopack.ps1

      - name: Smoke test packaged Windows server
        run: powershell -ExecutionPolicy Bypass -File scripts/smoke-windows-package.ps1 -ExpectedVersion "${{ steps.version.outputs.plain }}"

      - name: Detect Windows code signing configuration
        id: codesign
        shell: bash
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          if [[ -n "${WINDOWS_CODESIGN_PFX_BASE64}" && -n "${WINDOWS_CODESIGN_PASSWORD}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign Velopack release artifacts
        if: ${{ steps.codesign.outputs.enabled == 'true' }}
        shell: powershell
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "weir-codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
          $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
          $setupExe = Get-Item -LiteralPath "dist/windows/releases/Weir-win-Setup.exe" -ErrorAction Stop
          & $signtool sign /f $pfxPath /p $env:WINDOWS_CODESIGN_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $setupExe.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "signtool failed with exit code $LASTEXITCODE"
          }

      - name: Verify Velopack setup signature
        if: ${{ steps.codesign.outputs.enabled == 'true' }}
        shell: powershell
        run: |
          $setupExe = Get-Item -LiteralPath "dist/windows/releases/Weir-win-Setup.exe" -ErrorAction Stop
          $signature = Get-AuthenticodeSignature -FilePath $setupExe.FullName
          if ($signature.Status -ne "Valid") {
            throw "Setup signature verification failed: $($signature.Status) $($signature.StatusMessage)"
          }

      # After signing: signtool rewrites Setup.exe, so a hash taken earlier would not match the
      # file people download (and installers that verify SHA256SUMS.txt would refuse it).
      - name: Generate release artifact checksums
        shell: powershell
        run: |
          $releasesDir = "dist/windows/releases"
          Get-ChildItem -Path $releasesDir -File | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content -LiteralPath (Join-Path $releasesDir "SHA256SUMS.txt") -Encoding ascii
          }

      # After checksums, so the attestation covers the exact bytes SHA256SUMS.txt itself describes,
      # and gives anyone who downloads a Windows release file a way to verify it actually came from
      # this repo's own build (`gh attestation verify`), not just that some SHA256SUMS.txt says so.
      - name: Attest provenance of Windows release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/windows/releases/*

      - name: Upload Velopack release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weir-windows-velopack
          if-no-files-found: error
          path: dist/windows/releases/*

  # What CI cannot have proven: the artefacts built here, and advisories published since CI ran.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      WEIR_SESSION_SECRET: ${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-release-session-secret-32chars-min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Checked first so a missing file fails in seconds, not after the builds; publish reads it again.
      - name: Release notes file present
        run: |
          notes_file="docs/release-notes/${TAG}.md"
          if [ ! -f "$notes_file" ]; then
            echo "::error::Missing required release notes file: $notes_file"
            echo "::error::Create it from docs/release-notes/TEMPLATE.md before tagging."
            exit 1
          fi

      - name: Release publication gate ordering
        run: node scripts/check-release-workflow-gates.mjs

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: apps/server/global.json
          cache: true
          cache-dependency-path: apps/server/**/packages.lock.json

      # For the E2E smoke below. ci.yml already ran the server's tests on this commit (ci-passed).
      - name: Build Weir server (warnings are errors)
        working-directory: apps/server
        run: |
          dotnet restore Weir.slnx --locked-mode
          dotnet build Weir.slnx -warnaserror --no-restore

      # Advisories are published every day, so this is re-checked at release time, not taken from CI.
      - name: Server dependency vulnerability scan
        run: node scripts/check-dotnet-vulnerabilities.mjs apps/server/Weir.slnx

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/requirements.txt') }}

      - name: Install locked test runner and Playwright browser
        run: |
          python -m pip install --require-hashes -r tests/requirements.txt
          python -m playwright install --with-deps chromium

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # The web build that ships as weir-web-dist.zip, with the release's VITE_SUPPORT_URL.
      - name: Weir web - production build
        working-directory: apps/web
        env:
          VITE_SUPPORT_URL: ${{ vars.VITE_SUPPORT_URL }}
        run: |
          npm ci
          npm run build

      - name: Pack web dist
        run: |
          cd apps/web
          zip -r "$GITHUB_WORKSPACE/weir-web-dist.zip" dist

      # On push to main ci.yml skips its E2E smoke, so a release proves it here, against this build.
      - name: Weir E2E smoke (Playwright + real .NET server)
        env:
          WEIR_E2E: "1"
          WEIR_HOME: ${{ runner.temp }}/weir-e2e
        run: python -m pytest tests/e2e/weir -q --tb=short

      - name: Upload web dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weir-web-dist
          if-no-files-found: error
          path: weir-web-dist.zip

  # The linux/amd64 image, built and audited without credentials. Its layers go to this run's GitHub
  # Actions cache (not a registry), so publish rebuilds from them instead of from scratch.
  docker-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      WEIR_SESSION_SECRET: ${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-release-session-secret-32chars-min
      WEIR_LIVE_E2E_FIXTURE_HOST_ROOT: ${{ github.workspace }}/artifacts/docker-release-fixture
      WEIR_LIVE_E2E_FIXTURE_SERVER_ROOT: /e2e-fixture
      WEIR_LIVE_E2E_FFMPEG: ffmpeg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Normalize tag version
        id: version
        run: echo "plain=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/requirements.txt') }}

      - name: Install locked live-audit dependencies and browser
        run: |
          python -m pip install --require-hashes -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build unpushed Docker release candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          platforms: linux/amd64
          push: false
          tags: weir-release-candidate:${{ steps.version.outputs.plain }}
          cache-to: type=gha,mode=max,scope=weir-release-amd64,ignore-error=true

      # Before the candidate ever runs: a known HIGH/CRITICAL vulnerability with a fix already
      # available blocks the release outright. ignore-unfixed, because failing on something no
      # upstream fix exists for yet would just make every release wait on an unrelated CVE.
      - name: Trivy scan of Docker release candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: weir-release-candidate:${{ steps.version.outputs.plain }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Start unpushed Docker release candidate
        run: |
          docker rm -f weir-release-candidate >/dev/null 2>&1 || true
          mkdir -p "$WEIR_LIVE_E2E_FIXTURE_HOST_ROOT"
          chmod 0777 "$WEIR_LIVE_E2E_FIXTURE_HOST_ROOT"
          docker run -d --name weir-release-candidate -p 9347:9347 \
            -v "$WEIR_LIVE_E2E_FIXTURE_HOST_ROOT:$WEIR_LIVE_E2E_FIXTURE_SERVER_ROOT" \
            -e WEIR_SESSION_SECRET="$WEIR_SESSION_SECRET" \
            -e WEIR_SESSION_COOKIE_SECURE=false \
            "weir-release-candidate:${{ steps.version.outputs.plain }}"
          node scripts/wait-for-health.mjs --container weir-release-candidate

      - name: Full live E2E against unpushed Docker release candidate
        env:
          WEIR_LIVE_BASE_URL: http://127.0.0.1:9347
          WEIR_LIVE_EXPECTED_VERSION: ${{ steps.version.outputs.plain }}
          WEIR_LIVE_E2E_ARTIFACTS: artifacts/docker-release-candidate-e2e
          # The container sees the audit's browser as the Docker bridge gateway, not loopback, so
          # bootstrap needs the one-time setup code; the audit reads it from this container's own log.
          WEIR_LIVE_E2E_DOCKER_CONTAINER: weir-release-candidate
        run: python scripts/live-packaged-e2e.py

      - name: Upload Docker release-candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weir-docker-release-candidate-audit
          if-no-files-found: warn
          path: artifacts/docker-release-candidate-e2e/*

      - name: Cleanup unpushed Docker release candidate
        if: always()
        run: docker rm -f weir-release-candidate >/dev/null 2>&1 || true

  # The arm64 variant of the same candidate must build before anything is pushed. Separate from the
  # amd64 job so its ~4 minutes under QEMU overlap everything else instead of following it.
  docker-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Normalize tag version
        id: version
        run: echo "plain=${TAG#v}" >> "$GITHUB_OUTPUT"

      # QEMU for the arm64 image's final stage (apt-get). The .NET server is cross-published natively.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build unpushed Docker release candidate (linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: false
          tags: weir-release-candidate:${{ steps.version.outputs.plain }}-arm64
          cache-to: type=gha,mode=max,scope=weir-release-arm64,ignore-error=true

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Every gate. Without ci-passed a commit CI never passed could ship; without windows-smoke a Docker
    # image could reach ghcr for a release that has no Windows build.
    needs: [ci-passed, validate, windows-smoke, docker-candidate, docker-arm64]
    permissions:
      contents: write
      packages: write
    env:
      WEIR_SESSION_SECRET: ${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-release-session-secret-32chars-min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download web dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weir-web-dist
          path: ${{ github.workspace }}

      - name: Docker image name
        id: image
        run: echo "name=${REGISTRY}/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Normalize tag version
        id: version
        run: echo "plain=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download Velopack release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weir-windows-velopack
          path: ${{ github.workspace }}/windows-artifact

      # Only needed if the cache below misses: the published build then re-runs the arm64 final stage.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Registry credentials and public tags are not created until every job above has passed,
      # including the complete packaged browser/API audit of the unpushed candidate.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuilt from the layers docker-candidate and docker-arm64 cached. Only the version tag: `latest`
      # moves to it at the very end, once the image and the release are known good.
      - name: Publish release Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          cache-from: |
            type=gha,scope=weir-release-amd64
            type=gha,scope=weir-release-arm64
          tags: ${{ steps.image.outputs.name }}:${{ steps.version.outputs.plain }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.plain }}

      - name: Verify published Docker manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.version.outputs.plain }}
        run: |
          manifest="$(docker manifest inspect "$IMAGE")"
          echo "$manifest"
          for arch in amd64 arm64; do
            if ! echo "$manifest" | grep -q "\"architecture\": \"$arch\""; then
              echo "::error::The published manifest has no linux/$arch image."
              exit 1
            fi
          done

      - name: Smoke test published Docker image
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.version.outputs.plain }}
        run: |
          docker rm -f weir-release-smoke >/dev/null 2>&1 || true
          docker run -d --name weir-release-smoke -p 9347:9347 \
            -e WEIR_SESSION_SECRET="$WEIR_SESSION_SECRET" \
            -e WEIR_SESSION_COOKIE_SECURE=false \
            "$IMAGE"
          node scripts/wait-for-health.mjs --container weir-release-smoke

      - name: Cleanup Docker smoke container
        if: always()
        run: docker rm -f weir-release-smoke >/dev/null 2>&1 || true

      - name: Prepare user-facing release notes
        run: |
          notes_file="docs/release-notes/${TAG}.md"
          if [ ! -f "$notes_file" ]; then
            echo "::error::Missing required release notes file: $notes_file"
            echo "::error::Create it from docs/release-notes/TEMPLATE.md before tagging."
            exit 1
          fi
          cp "$notes_file" "$GITHUB_WORKSPACE/release-notes.md"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            weir-web-dist.zip
            windows-artifact/*
          body_path: release-notes.md

      # Last, so `latest` only ever names an image that passed its smoke and has a published release. A copy of
      # the version's manifest list: both architectures, provenance and SBOM included, nothing rebuilt.
      - name: Tag the published image latest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.version.outputs.plain }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"
